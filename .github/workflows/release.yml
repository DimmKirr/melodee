name: Release firmware and recovery tools

on:
  push:
    branches: [next, release/recovery-v1.3.1]
    paths:
      - '.gitattributes'
      - '.github/workflows/release.yml'
      - 'tools/fm1_recover.py'
      - 'tools/build_recovery.py'
      - 'tools/prepare_release.py'
      - 'tools/prepare_recovery_correction.py'
      - 'assets/recovery/**'
      - 'tests/recovery_test.py'
      - 'tests/recovery_correction_test.py'
      - 'tests/release_assets_test.py'
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Run E2E browser tests'
        type: boolean
        default: false

permissions:
  contents: read

# A rerun must not replace a public release with a partially rebuilt one.
concurrency:
  group: melodee-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 tools/fm1_recover.py --version | awk '{print $NF}')
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/RELEASE_$version.md"
          release_flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Refusing to rebuild a public release'; exit 1; }
            gh release edit "$GITHUB_REF_NAME" --draft=true \
              --title "Melodee $version" --notes-file "docs/RELEASE_$version.md" \
              "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Melodee $version" --notes-file "docs/RELEASE_$version.md" \
              "${release_flags[@]}"
          fi

  build:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dimmkirr/setup-fm1-toolchain@v1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python3 -m pip install fonttools mido
      - name: Build firmware
        run: |
          set -euo pipefail
          export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
          export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
          export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
          version=$(python3 tools/fm1_recover.py --version | awk '{print $NF}')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          ./build.sh --release "$version"
          cp "build/melodee-$version.fwsc" build/melodee.fwsc
          mkdir -p build/release-assets
          cp "build/release-$version/"*.fwsc "build/release-$version/"*-app.bin build/release-assets/
      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/release-assets/*.fwsc
            build/release-assets/*-app.bin
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/release-assets/*
      - name: Upload build tree for test job
        uses: actions/upload-artifact@v4
        with:
          name: build-tree
          path: build/

  unit-test:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python3 -m pip install Pillow fonttools mido
      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: build-tree
          path: build/
      - name: Run host tests
        run: |
          set -euo pipefail
          export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
          export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
          export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
          tests/run_tests.sh
      - name: Generate manual screenshots for stable release
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          python3 tools/manual_shots.py
          python3 tools/manual_shots.py --require
          tar -czf build/release-assets/manual-screenshots.tar.gz -C web/manual \
            $(find web/manual -name '*.png' | sed 's|^web/manual/||')
      - name: Upload manual screenshots
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots
          path: build/release-assets/manual-screenshots.tar.gz

  recovery:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: macos-14
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned bundler and USB dependencies
        run: python -m pip install pyinstaller==6.22.3 pyusb==1.3.1
      - name: Test recovery logic
        run: |
          python tests/recovery_test.py
          python tests/recovery_correction_test.py
      - name: Build and smoke-test native executable
        run: python tools/build_recovery.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.target }}
          path: build/recovery/${{ matrix.target }}/*.zip

  publish:
    if: github.event_name != 'pull_request'
    needs: [unit-test, recovery]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      attestations: read
    concurrency:
      group: ${{ github.ref == 'refs/heads/release/recovery-v1.3.1' && 'melodee-recovery-v1.3.1' || 'melodee-nightly-pages' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/release-assets
      - name: Verify firmware attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: recovery-*
          path: build/release-assets
          merge-multiple: true
      - name: Download manual screenshots from test job
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: actions/download-artifact@v4
        with:
          name: manual-screenshots
          path: build/
      - name: Unpack generated manual screenshots
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          tar -xzf build/manual-screenshots.tar.gz -C web/manual
          python3 tools/manual_shots.py --require
      - name: Validate release provenance and every archive checksum
        run: |
          version=$(python tools/fm1_recover.py --version | awk '{print $NF}')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python tools/prepare_release.py "$version" build/release-assets
      - name: Publish complete release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          release_flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release upload "$GITHUB_REF_NAME" \
            build/release-assets/fm1-recover-*.zip \
            "build/release-assets/melodee-$version-licenses.zip" \
            build/release-assets/BUILD_INFO.json build/release-assets/SHA256SUMS --clobber
          if [[ "$version" != *-* ]]; then
            archive=$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[] | select(.name == "manual-screenshots.tar.gz") | .name')
            if [[ -n "$archive" ]]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$archive" --yes
            fi
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --title "Melodee $version" --notes-file "docs/RELEASE_$version.md" \
            "${release_flags[@]}"
      - name: Prepare correction while preserving published firmware
        if: github.ref == 'refs/heads/release/recovery-v1.3.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin tag v1.3.1
          gh release download v1.3.1 --dir build/published-release
          python tools/prepare_recovery_correction.py 1.3.1 build/published-release \
            build/release-assets build/recovery-correction
      - name: Retain original release metadata
        if: github.ref == 'refs/heads/release/recovery-v1.3.1'
        uses: actions/upload-artifact@v4
        with:
          name: original-v1.3.1-release-metadata
          path: |
            build/published-release/BUILD_INFO.json
            build/published-release/SHA256SUMS
      - name: Publish corrected recovery tools
        if: github.ref == 'refs/heads/release/recovery-v1.3.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.3.1 build/recovery-correction/fm1-recover-*.zip --clobber
          gh release upload v1.3.1 build/recovery-correction/BUILD_INFO.json \
            build/recovery-correction/SHA256SUMS --clobber
          gh release edit v1.3.1 --notes-file docs/RELEASE_1.3.1.md
      - name: Verify public correction bytes and metadata
        if: github.ref == 'refs/heads/release/recovery-v1.3.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.3.1 --dir build/verified-release
          python tools/prepare_recovery_correction.py 1.3.1 build/verified-release \
            build/release-assets build/verified-correction --verify-published
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          ref: gh-pages
          path: .nightly-pages
      - name: Stage previous stable releases for the version selector
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python web/import_releases.py .nightly-pages --repo "$GITHUB_REPOSITORY"
      - name: Publish stable installer while preserving the nightly channel
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          version=${GITHUB_REF_NAME#v}
          python3 tools/manual_shots.py --require
          python web/make_site.py "build/release-assets/melodee-$version.fwsc" \
            "$version" .nightly-pages
          cd .nightly-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "release: publish Melodee $version"
            git push origin HEAD:gh-pages
          fi
      - name: Publish release candidate beside stable and nightly
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.')
        run: |
          python web/publish_rc.py .nightly-pages build/release-assets
          cd .nightly-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp firmware
          if ! git diff --cached --quiet; then
            git commit -m "release: publish candidate $GITHUB_REF_NAME"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages rebuild
        if: startsWith(github.ref, 'refs/tags/') && (!contains(github.ref_name, '-') || contains(github.ref_name, '-rc.'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  e2e-test:
    if: github.event_name != 'pull_request' && (vars.E2E_ENABLED == 'true' || inputs.e2e)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/release-assets/
      - name: Pick firmware package
        run: |
          fwsc=$(ls build/release-assets/*.fwsc | head -1)
          cp "$fwsc" build/melodee.fwsc
      - name: Install E2E dependencies
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Install fm1-emu
        run: |
          git clone --depth 1 https://github.com/joakimeriksson/fm1-emu.git /tmp/fm1-emu
          mkdir -p tests/fm1-emu
          for f in index.html main.js style.css worklet.js fwsc.js jit.js firmwares.json; do
            cp "/tmp/fm1-emu/web/$f" "tests/fm1-emu/$f"
          done
          # Apply local patches if any exist
          if [ -d tests/fm1-emu-patches ]; then
            for p in tests/fm1-emu-patches/*.patch; do
              [ -f "$p" ] && patch -d tests/fm1-emu -p1 < "$p"
            done
          fi
          # WASM binary is not in the source repo; download from Pages
          curl -fsSL https://joakimeriksson.github.io/fm1-emu/fm1_web.wasm \
            -o tests/fm1-emu/fm1_web.wasm
      - name: Run E2E tests
        id: e2e
        continue-on-error: true
        run: |
          E2E_DEBUG=1 python3 -m unittest \
            tests.e2e_load_firmware_test \
            -v 2>&1 | tee e2e-output.txt
      - name: Collect screenshot paths
        if: always()
        id: results
        run: |
          results_dir=$(ls -dt tests/results/*-e2e_load_firmware_test 2>/dev/null | head -1)
          echo "results_dir=${results_dir:-none}" >> "$GITHUB_OUTPUT"
          if [ -d "$results_dir/screenshots" ]; then
            echo "screenshot_dir=$results_dir/screenshots" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload E2E screenshots
        if: always() && steps.results.outputs.screenshot_dir
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ steps.results.outputs.screenshot_dir }}
          retention-days: 14
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            tests/results/*/fm1-emulator.log
            e2e-output.txt
          retention-days: 14
      - name: Generate status page with screenshots
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          SCREENSHOT_DIR: ${{ steps.results.outputs.screenshot_dir }}
          RESULTS_DIR: ${{ steps.results.outputs.results_dir }}
        run: |
          {
            echo "# E2E Test Results"
            echo ""
            if [ "$E2E_OUTCOME" = "success" ]; then
              echo "**Status:** :white_check_mark: All E2E tests passed"
            else
              echo "**Status:** :x: Some E2E tests failed"
            fi
            echo ""
            if [ -f e2e-output.txt ]; then
              echo "<details><summary>Test output</summary>"
              echo ""
              echo '```'
              tail -30 e2e-output.txt
              echo '```'
              echo "</details>"
              echo ""
            fi
            if [ -d "$SCREENSHOT_DIR" ]; then
              echo "## Screenshots"
              echo ""
              for png in "$SCREENSHOT_DIR"/*.png; do
                [ -f "$png" ] || continue
                name=$(basename "$png" .png)
                label=$(echo "$name" | sed 's/^[0-9T]*Z-//' | tr '-_' '  ')
                echo "### $label"
                echo ""
                b64=$(base64 -w 0 "$png")
                echo "<img src=\"data:image/png;base64,$b64\" width=\"800\" alt=\"$label\">"
                echo ""
              done
            fi
            if [ -f "$RESULTS_DIR/fm1-emulator.log" ]; then
              echo "<details><summary>Emulator log</summary>"
              echo ""
              echo '```'
              head -50 "$RESULTS_DIR/fm1-emulator.log"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if E2E tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
